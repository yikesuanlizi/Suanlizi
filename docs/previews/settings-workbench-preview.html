<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suanlizi · 设置工作台预览</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eef1f5;
      --noise: rgba(31, 42, 61, .035);
      --shell: #f9fafb;
      --rail: #f1f3f6;
      --panel: #ffffff;
      --panel-subtle: #f7f8fa;
      --input: #ffffff;
      --ink: #172033;
      --ink-soft: #526078;
      --ink-faint: #8a97ab;
      --line: #dce2eb;
      --line-strong: #c6d0de;
      --focus: #356fcb;
      --focus-soft: #e8f0ff;
      --danger: #c84c4c;
      --success: #2e7d68;
      --shadow: 0 28px 76px rgba(27, 39, 61, .16), 0 2px 10px rgba(27, 39, 61, .05);
      --font-ui: "MiSans", "HarmonyOS Sans SC", "Segoe UI Variable Text", "Microsoft YaHei UI", sans-serif;
      --font-code: "Cascadia Mono", "Sarasa Mono SC", Consolas, monospace;
    }

    [data-skin="dark"] {
      color-scheme: dark;
      --canvas: #0a0e13;
      --noise: rgba(226, 232, 240, .016);
      --shell: #121820;
      --rail: #0e131a;
      --panel: #171e27;
      --panel-subtle: #11171e;
      --input: #0c1218;
      --ink: #e9edf2;
      --ink-soft: #aab4c0;
      --ink-faint: #737f8e;
      --line: #27313c;
      --line-strong: #394653;
      --focus: #82add9;
      --focus-soft: rgba(94, 143, 190, .15);
      --danger: #e78d97;
      --success: #79bda1;
      --shadow: 0 32px 96px rgba(0, 0, 0, .5), 0 1px 0 rgba(255,255,255,.035) inset;
    }
    [data-skin="dark"] .mark { background: #315473; box-shadow: 0 3px 10px rgba(0, 0, 0, .32); }
    [data-skin="dark"] .primary-button { border-color: #527da8; background: #426b94; box-shadow: 0 2px 9px rgba(0, 0, 0, .22); }
    [data-skin="dark"] .primary-button:hover { background: #4b789f; }

    * { box-sizing: border-box; }
    html, body { min-width: 860px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-ui);
      background:
        radial-gradient(80rem 48rem at 12% -20%, rgba(79, 112, 165, .12), transparent 48%),
        radial-gradient(56rem 42rem at 100% 110%, rgba(46, 125, 104, .075), transparent 48%),
        var(--canvas);
      letter-spacing: .005em;
      transition: background .25s ease, color .25s ease;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .82;
      background-image: radial-gradient(var(--noise) .75px, transparent .75px);
      background-size: 5px 5px;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .stage { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .settings {
      position: relative;
      width: min(1180px, calc(100vw - 56px));
      height: min(790px, calc(100vh - 56px));
      min-height: 620px;
      display: grid;
      grid-template-columns: 216px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      background: var(--shell);
      box-shadow: var(--shadow);
    }

    .topbar {
      grid-column: 1 / -1;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--shell) 90%, var(--panel));
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark {
      width: 22px; height: 22px; display: grid; place-items: center;
      color: white; font-size: 12px; line-height: 1; font-weight: 700;
      background: #244e8e; border-radius: 7px; box-shadow: 0 3px 8px rgba(28,75,142,.25);
    }
    .brand strong { font-size: 15px; font-weight: 650; letter-spacing: .015em; }
    .brand span { color: var(--ink-faint); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .theme-toggle, .close-button, .ghost-button, .quiet-button, .primary-button, .danger-button {
      height: 32px; border-radius: 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink-soft);
      transition: background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
    }
    .theme-toggle { padding: 0 10px; font-size: 12px; }
    .close-button { width: 32px; font-size: 21px; line-height: 1; font-weight: 300; }
    .theme-toggle:hover, .close-button:hover, .ghost-button:hover, .quiet-button:hover { background: var(--panel-subtle); color: var(--ink); border-color: var(--ink-faint); }
    .close-button:hover { color: var(--danger); }

    .rail {
      min-width: 0;
      padding: 16px 10px;
      border-right: 1px solid var(--line);
      background: var(--rail);
    }
    .rail-label { padding: 0 10px 9px; color: var(--ink-faint); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .nav { display: grid; gap: 3px; }
    .nav button {
      width: 100%; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
      border: 0; border-radius: 8px; color: var(--ink-soft); background: transparent; text-align: left; font-size: 13px; font-weight: 520;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    }
    .nav button:hover { color: var(--ink); background: color-mix(in srgb, var(--panel) 78%, transparent); }
    .nav button.active { color: var(--ink); background: var(--panel); box-shadow: 0 1px 1px rgba(20,30,46,.04), 0 0 0 1px var(--line) inset; }
    .nav-icon { width: 17px; color: var(--ink-faint); font-size: 14px; text-align: center; }
    .nav button.active .nav-icon { color: var(--focus); }
    .rail-footer { margin: 20px 10px 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: 11px; line-height: 1.55; }
    .rail-footer b { display: block; color: var(--ink-soft); margin-bottom: 2px; font-size: 11px; font-weight: 600; }

    .content { min-width: 0; min-height: 0; overflow: auto; padding: 32px 42px 40px; background: var(--shell); }
    .page { max-width: 850px; margin: 0 auto; animation: in .18s ease both; }
    @keyframes in { from { opacity: .25; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--focus); font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 5px 0 4px; color: var(--ink); font-size: 21px; letter-spacing: -.025em; font-weight: 660; }
    .page-header p { margin: 0; color: var(--ink-soft); font-size: 12px; }
    .page-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
    .primary-button { padding: 0 13px; border-color: #2e63b8; color: white; background: #2f67bf; font-size: 12px; font-weight: 620; box-shadow: 0 1px 1px rgba(9, 36, 81, .18); }
    .primary-button:hover { background: #285bab; transform: translateY(-1px); }
    .ghost-button, .quiet-button { padding: 0 12px; font-size: 12px; }
    .quiet-button { border-color: transparent; }
    .danger-button { padding: 0 10px; color: var(--danger); font-size: 12px; }

    .section { padding: 23px 0; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .section-heading h2 { margin: 0; font-size: 13px; font-weight: 680; letter-spacing: -.01em; }
    .section-heading p { margin: 0; color: var(--ink-faint); font-size: 11px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 18px; }
    .form-grid.three { grid-template-columns: 1.05fr 1fr .82fr; }
    .field { min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 6px; color: var(--ink-soft); font-size: 11px; font-weight: 590; }
    .field small { display: block; margin-top: 5px; color: var(--ink-faint); font-size: 10px; }
    .control, .select-control {
      width: 100%; height: 37px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px;
      outline: 0; color: var(--ink); background: var(--input); font-size: 13px; box-shadow: 0 1px 1px rgba(16,29,52,.015);
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .control:hover, .select-control:hover { border-color: color-mix(in srgb, var(--line-strong) 62%, var(--ink-faint)); }
    .control:focus, .select-control:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-soft); }
    .select-control { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 11px) 15px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; padding-right: 28px; }
    .inline-control { display: flex; align-items: center; gap: 8px; }
    .inline-control .control { flex: 1 1 auto; width: auto; min-width: 0; }
    .inline-control .select-control { flex: 0 0 136px; }
    .inline-control .quiet-button { flex: 0 0 auto; white-space: nowrap; }
    .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink-soft); background: var(--panel-subtle); font-size: 10px; white-space: nowrap; }
    .chip.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, var(--line)); background: color-mix(in srgb, var(--success) 8%, var(--panel-subtle)); }
    .chip.dot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .model-current { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-subtle); }
    .model-current strong { display: block; color: var(--ink); font-size: 12px; font-weight: 640; }
    .model-current span { display: block; margin-top: 3px; color: var(--ink-faint); font-size: 11px; font-family: var(--font-code); }

    .preset-line, .choice-row, .status-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .preset-line .select-control { flex: 1 1 auto; }
    .preset-line .danger-button { flex: 0 0 auto; }
    .row-card { padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    .row-card + .row-card { margin-top: 8px; }
    .row-card-main { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 16px; }
    .row-card-text { min-width: 0; }
    .row-card-text strong { display: block; color: var(--ink); font-size: 12px; font-weight: 650; }
    .row-card-text span { display: block; margin-top: 4px; overflow: hidden; color: var(--ink-soft); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .row-card-actions { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
    .divider-note { padding: 9px 11px; border-left: 2px solid var(--focus); border-radius: 0 7px 7px 0; color: var(--ink-soft); background: color-mix(in srgb, var(--focus-soft) 72%, transparent); font-size: 11px; line-height: 1.55; }

    .segmented { display: inline-flex; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-subtle); }
    .segmented button { height: 27px; padding: 0 10px; border: 0; border-radius: 5px; color: var(--ink-faint); background: transparent; font-size: 11px; }
    .segmented button.active { color: var(--ink); background: var(--panel); box-shadow: 0 1px 2px rgba(24,36,59,.12); }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; }
    .switch-row + .switch-row { border-top: 1px solid var(--line); }
    .switch-copy strong { display: block; color: var(--ink); font-size: 12px; font-weight: 620; }
    .switch-copy span { display: block; margin-top: 4px; color: var(--ink-faint); font-size: 11px; }
    .switch { position: relative; width: 34px; height: 20px; flex: 0 0 auto; border: 0; border-radius: 99px; background: var(--line-strong); }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,.17); transition: transform .16s ease; }
    .switch.on { background: var(--focus); }
    .switch.on::after { transform: translateX(14px); }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .mini-card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    .mini-card strong { display: block; color: var(--ink); font-size: 12px; font-weight: 650; }
    .mini-card p { margin: 5px 0 0; color: var(--ink-soft); font-size: 11px; line-height: 1.55; }
    .mini-card .chip { margin-top: 10px; }
    .feature-list { display: grid; gap: 0; padding: 0 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    .feature-list .switch-row:last-child { border: 0; }
    .avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .avatar { aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--ink-soft); background: var(--panel-subtle); font-size: 20px; }
    .avatar.active { outline: 2px solid var(--focus); outline-offset: 1px; background: var(--focus-soft); }
    .empty { padding: 24px; border: 1px dashed var(--line-strong); border-radius: 9px; color: var(--ink-faint); text-align: center; font-size: 12px; }
    .plugin-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .plugin-card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    .plugin-card-head { display: flex; align-items: center; gap: 8px; }
    .plugin-icon { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; color: var(--focus); background: var(--focus-soft); font-size: 12px; }
    .plugin-card b { min-width: 0; overflow: hidden; color: var(--ink); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .plugin-card p { margin: 9px 0 12px; height: 34px; overflow: hidden; color: var(--ink-soft); font-size: 11px; line-height: 1.5; }
    .plugin-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .plugin-card-footer .quiet-button { height: 28px; padding: 0 9px; }
    .catalog-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .catalog-tabs { display: flex; align-items: center; gap: 3px; padding: 3px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-subtle); }
    .catalog-tabs button { height: 28px; padding: 0 10px; border: 0; border-radius: 5px; color: var(--ink-faint); background: transparent; font-size: 11px; white-space: nowrap; }
    .catalog-tabs button.active { color: var(--ink); background: var(--panel); box-shadow: 0 1px 2px rgba(24,36,59,.1); }
    .search-field { width: 190px; flex: 0 1 190px; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; color: var(--ink); background: var(--input); font-size: 11px; }
    .subpane[hidden] { display: none; }
    .catalog-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 11px; color: var(--ink-faint); font-size: 11px; }
    .catalog-summary b { color: var(--ink); font-weight: 650; }
    .plugin-card code, .connection-detail code { color: var(--ink-soft); font-family: var(--font-code); font-size: 10px; }
    .plugin-card .card-meta { display: flex; align-items: center; gap: 6px; color: var(--ink-faint); font-size: 10px; }
    .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink-faint); background: var(--panel-subtle); font-size: 9px; font-family: var(--font-code); }
    .settings-subtitle { margin: 0 0 12px; color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
    .dense-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(230px, .8fr); gap: 18px; }
    .cluster { padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    .cluster + .cluster { margin-top: 10px; }
    .cluster-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
    .cluster-header h3 { margin: 0; color: var(--ink); font-size: 13px; font-weight: 660; }
    .cluster-header p { margin: 4px 0 0; color: var(--ink-faint); font-size: 10px; }
    .cluster-body { padding-top: 13px; }
    .cluster .form-grid { gap: 12px; }
    .cluster .control, .cluster .select-control { height: 35px; font-size: 12px; }
    .cluster .field label { margin-bottom: 5px; font-size: 10px; }
    .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 13px; }
    .action-row .primary-button, .action-row .ghost-button { height: 30px; }
    .connection-detail { display: grid; gap: 9px; padding: 0; }
    .connection-detail div { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; color: var(--ink-soft); font-size: 11px; }
    .connection-detail span:first-child { color: var(--ink-faint); }
    .compact-option { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .compact-option:first-child { padding-top: 0; border-top: 0; }
    .compact-option strong { color: var(--ink); font-size: 11px; font-weight: 620; }
    .compact-option p { margin: 3px 0 0; color: var(--ink-faint); font-size: 10px; }
    .compact-option .switch { transform: scale(.86); transform-origin: right center; }
    .remote-stack { display: grid; gap: 13px; }
    .remote-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .readonly-line { min-height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink-soft); background: var(--panel-subtle); font-size: 11px; }
    .readonly-line code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .helper { display: flex; align-items: flex-start; gap: 7px; margin-top: 10px; color: var(--ink-faint); font-size: 10px; line-height: 1.55; }
    .helper i { color: var(--focus); font-style: normal; }
    @media (max-width: 980px) { .dense-grid { grid-template-columns: 1fr; } .remote-columns { grid-template-columns: 1fr; } }

    .notice { position: absolute; right: 18px; bottom: 17px; display: none; padding: 9px 11px; border: 1px solid color-mix(in srgb, var(--success) 45%, var(--line)); border-radius: 8px; color: var(--success); background: color-mix(in srgb, var(--panel) 85%, var(--success)); box-shadow: 0 10px 24px rgba(16, 31, 54, .16); font-size: 12px; }
    .notice.show { display: block; animation: toast .18s ease both; }
    @keyframes toast { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (max-width: 980px) { .settings { grid-template-columns: 190px minmax(0,1fr); } .content { padding: 28px; } .form-grid.three { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="stage">
    <section class="settings" aria-label="Suanlizi 设置工作台预览">
      <header class="topbar">
        <div class="brand"><div class="mark">N</div><strong>Suanlizi</strong><span>设置</span></div>
        <div class="top-actions"><button class="theme-toggle" id="themeToggle" type="button">切换深色</button><button class="close-button" aria-label="关闭预览" type="button">×</button></div>
      </header>
      <aside class="rail">
        <div class="rail-label">配置工作台</div>
        <nav class="nav" aria-label="设置分类">
          <button class="active" data-page="models" type="button"><span class="nav-icon">◇</span>模型</button>
          <button data-page="access" type="button"><span class="nav-icon">⌘</span>权限与工作区</button>
          <button data-page="appearance" type="button"><span class="nav-icon">◐</span>外观</button>
          <button data-page="memory" type="button"><span class="nav-icon">◌</span>记忆</button>
          <button data-page="performance" type="button"><span class="nav-icon">↯</span>性能</button>
          <button data-page="plugins" type="button"><span class="nav-icon">⊞</span>插件中心</button>
          <button data-page="remote" type="button"><span class="nav-icon">⌁</span>远程助手</button>
        </nav>
      </aside>
      <div class="content" id="content"></div>
      <div class="notice" id="notice" role="status">已应用到当前默认模型</div>
    </section>
  </main>

  <template id="models">
    <article class="page">

  <script>
    const content = document.getElementById('content');
    const notice = document.getElementById('notice');
    const nav = [...document.querySelectorAll('.nav button')];
    function renderPage(id) {
      content.replaceChildren(document.getElementById(id).content.cloneNode(true));
      nav.forEach((button) => button.classList.toggle('active', button.dataset.page === id));
      // 预览只保留配置数据与操作；完整教学说明由主界面的真实“使用说明”弹窗承载。
      content.querySelectorAll('.page-header p, .section-heading > p, .switch-copy > span, .cluster-header p, .compact-option p, .catalog-summary, .helper, .plugin-card > p').forEach((node) => node.remove());
      content.querySelectorAll('.switch').forEach((button) => button.addEventListener('click', () => button.classList.toggle('on')));
      content.querySelectorAll('.apply').forEach((button) => button.addEventListener('click', () => {
        notice.classList.add('show');
        window.setTimeout(() => notice.classList.remove('show'), 1900);
      }));
      content.querySelectorAll('[data-subtab]').forEach((button) => button.addEventListener('click', () => {
        const group = button.dataset.group;
        const target = button.dataset.target;
        content.querySelectorAll(`[data-subtab][data-group="${group}"]`).forEach((item) => item.classList.toggle('active', item === button));
        content.querySelectorAll(`[data-subpane][data-group="${group}"]`).forEach((pane) => { pane.hidden = pane.id !== target; });
      }));
    }
    nav.forEach((button) => button.addEventListener('click', () => renderPage(button.dataset.page)));
    document.getElementById('themeToggle').addEventListener('click', (event) => {
      const dark = document.documentElement.dataset.skin !== 'dark';
      document.documentElement.dataset.skin = dark ? 'dark' : 'light';
      event.currentTarget.textContent = dark ? '切换浅色' : '切换深色';
    });
    renderPage('models');
  </script>
